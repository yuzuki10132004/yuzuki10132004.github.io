<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<!-- ホーム画面に追加したとき、ブラウザではなく専用アプリとして全画面で開くための指定 -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AirPods">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<title>AirPods</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#f2f2f7; --card:#ffffff; --well:#e9e9ee; --text:#111116; --sub:#8a8a93; --line:rgba(0,0,0,.06);
    --blue:#007aff; --green:#30d158;
    --shadow:0 10px 30px rgba(20,20,40,.07);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#000000; --card:#1c1c1e; --well:#2c2c2e; --text:#f5f5f7; --sub:#86868e; --line:rgba(255,255,255,.07); --shadow:none; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
  .app{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 26px) 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
  /* ---- hero ---- */
  .hero{text-align:center;padding:6px 0 2px}
  .buds{width:104px;height:104px;margin:0 auto;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center}
  .buds svg{width:58px;height:58px;stroke:var(--text)}
  .hero h1{font-size:27px;font-weight:700;letter-spacing:-.02em;margin:16px 0 0;display:flex;align-items:center;justify-content:center;gap:9px}
  .hero h1 span{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--sub);background:var(--well);padding:4px 8px;border-radius:999px}
  .status{margin:12px auto 0;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--sub);background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px;box-shadow:var(--shadow)}
  .status .dot{width:7px;height:7px;border-radius:50%;background:#c7c7cc;flex-shrink:0}
  .status.on .dot{background:var(--green);box-shadow:0 0 0 4px rgba(48,209,88,.18)}
  .status b{color:var(--text);font-weight:600}
  /* ---- section label ---- */
  .sec{font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--sub);margin:28px 2px 10px}
  /* ---- mode tiles ---- */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{
    appearance:none;text-decoration:none;color:var(--text);background:var(--card);border:none;
    border-radius:26px;min-height:138px;padding:18px 12px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    box-shadow:var(--shadow);cursor:pointer;position:relative;transition:transform .1s ease, background .18s ease, color .18s ease;
  }
  .tile:active{transform:scale(.96)}
  .tile svg{width:34px;height:34px}
  .tile .label{font-size:15px;font-weight:600;line-height:1.15;text-align:center}
  .tile .check{position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.28);color:#fff;display:none;place-items:center;font-size:11px;font-weight:800;line-height:1}
  .tile.active{background:var(--blue);color:#fff}
  .tile.active .check{display:grid}
  /* ---- presets ---- */
  .presets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .tile.preset{min-height:78px;border-radius:22px;padding:12px 6px 10px;gap:7px}
  .tile.preset svg{width:24px;height:24px}
  .tile.preset .label{font-size:13.5px}
  .tile.preset .check{top:8px;right:8px;width:17px;height:17px;font-size:9px}
</style>
</head>
<body>
<div class="app">

  <div class="hero">
    <div class="buds" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none" stroke-width="3.4" stroke-linecap="round">
        <circle cx="23" cy="20" r="10"/>
        <path d="M27 28v18"/>
        <circle cx="41" cy="20" r="10"/>
        <path d="M37 28v18"/>
      </svg>
    </div>
    <h1>AirPods <span>PRO 3</span></h1>
    <div><span class="status" id="statusBox" aria-live="polite"><span class="dot"></span><span id="statusText">未選択</span></span></div>
  </div>

  <p class="sec">ノイズコントロール</p>
  <div class="modes" id="modeGrid">
    <a class="tile" href="shortcuts://x-callback-url/run-shortcut?name=AirPods%20NC&amp;x-success=https%3A%2F%2Fyuzuki10132004.github.io%2F&amp;x-cancel=https%3A%2F%2Fyuzuki10132004.github.io%2F&amp;x-error=https%3A%2F%2Fyuzuki10132004.github.io%2F" data-mode="ノイズキャンセリング" data-group="mode" aria-label="ノイズキャンセリング">
      <span class="check">✓</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 10v4"/></svg>
      <span class="label">ノイズ<br>キャンセリング</span>
    </a>
    <a class="tile" href="shortcuts://x-callback-url/run-shortcut?name=AirPods%20%E5%A4%96%E9%83%A8%E9%9F%B3&amp;x-success=https%3A%2F%2Fyuzuki10132004.github.io%2F&amp;x-cancel=https%3A%2F%2Fyuzuki10132004.github.io%2F&amp;x-error=https%3A%2F%2Fyuzuki10132004.github.io%2F" data-mode="外部音取り込み" data-group="mode" aria-label="外部音取り込み">
      <span class="check">✓</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12c-1.5-1-1.5-4 0-6 1-1.3 3-1 4 .5C11.5 8 12 10 12 12s-.5 4-1.5 5.5c-1 1.5-3 1.8-4 .5-1.5-2-1.5-5 0-6Z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
      <span class="label">外部音<br>取り込み</span>
    </a>
    <a class="tile" href="shortcuts://x-callback-url/run-shortcut?name=AirPods%20%E9%81%A9%E5%BF%9C%E5%9E%8B&amp;x-success=https%3A%2F%2Fyuzuki10132004.github.io%2F&amp;x-cancel=https%3A%2F%2Fyuzuki10132004.github.io%2F&amp;x-error=https%3A%2F%2Fyuzuki10132004.github.io%2F" data-mode="適応型" data-group="mode" aria-label="適応型">
      <span class="check">✓</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 3 10 2.5-7 1.5 2H21"/></svg>
      <span class="label">適応型</span>
    </a>
    <a class="tile" href="shortcuts://x-callback-url/run-shortcut?name=AirPods%20%E3%82%AA%E3%83%95&amp;x-success=https%3A%2F%2Fyuzuki10132004.github.io%2F&amp;x-cancel=https%3A%2F%2Fyuzuki10132004.github.io%2F&amp;x-error=https%3A%2F%2Fyuzuki10132004.github.io%2F" data-mode="オフ" data-group="mode" aria-label="オフ">
      <span class="check">✓</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/></svg>
      <span class="label">オフ</span>
    </a>
  </div>

  <p class="sec">プリセット</p>
  <div class="presets" id="presetGrid">
    <a class="tile preset" href="shortcuts://x-callback-url/run-shortcut?name=AirPods%20NC&amp;x-success=https%3A%2F%2Fyuzuki10132004.github.io%2F&amp;x-cancel=https%3A%2F%2Fyuzuki10132004.github.io%2F&amp;x-error=https%3A%2F%2Fyuzuki10132004.github.io%2F" data-mode="集中" data-group="preset" aria-label="プリセット 集中">
      <span class="check">✓</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7" opacity=".55"/><circle cx="12" cy="12" r="10" opacity=".3"/></svg>
      <span class="label">集中</span>
    </a>
    <a class="tile preset" href="shortcuts://x-callback-url/run-shortcut?name=AirPods%20%E9%81%A9%E5%BF%9C%E5%9E%8B&amp;x-success=https%3A%2F%2Fyuzuki10132004.github.io%2F&amp;x-cancel=https%3A%2F%2Fyuzuki10132004.github.io%2F&amp;x-error=https%3A%2F%2Fyuzuki10132004.github.io%2F" data-mode="通勤" data-group="preset" aria-label="プリセット 通勤">
      <span class="check">✓</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10h14M9 21l1.5-4M15 21l-1.5-4"/><circle cx="9" cy="13.5" r=".6" fill="currentColor"/><circle cx="15" cy="13.5" r=".6" fill="currentColor"/></svg>
      <span class="label">通勤</span>
    </a>
    <a class="tile preset" href="shortcuts://x-callback-url/run-shortcut?name=AirPods%20%E5%A4%96%E9%83%A8%E9%9F%B3&amp;x-success=https%3A%2F%2Fyuzuki10132004.github.io%2F&amp;x-cancel=https%3A%2F%2Fyuzuki10132004.github.io%2F&amp;x-error=https%3A%2F%2Fyuzuki10132004.github.io%2F" data-mode="家" data-group="preset" aria-label="プリセット 家">
      <span class="check">✓</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg>
      <span class="label">家</span>
    </a>
  </div>


</div>
<script>
  var box=document.getElementById('statusBox'), text=document.getElementById('statusText');
  function fmt(d){ return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
  function handle(e){
    var el=e.currentTarget, name=el.getAttribute('data-mode'), href=el.getAttribute('href');
    document.querySelectorAll('.tile').forEach(function(n){
      n.classList.toggle('active', n===el || n.getAttribute('href')===href);
    });
    box.classList.add('on');
    text.innerHTML='<b>'+name+'</b> · '+fmt(new Date());
    if(navigator.vibrate) navigator.vibrate(10);
  }
  document.querySelectorAll('.tile').forEach(function(t){ t.addEventListener('click', handle); });
</script>
</body>
</html>
